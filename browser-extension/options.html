<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Incremental Reading — extension settings</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="options">
    <h1>Connect to the app</h1>
    <p class="muted">In the app, open <b>Tools → Browser extension</b>, copy the token, and paste it here.</p>
    <div class="row">
      <input id="token" type="password" placeholder="token" autocomplete="off" />
      <button id="save" class="primary">Save</button>
      <button id="test">Test connection</button>
    </div>
    <p id="status" class="muted"></p>
    <script src="options.js"></script>
  </body>
</html>
